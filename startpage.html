<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">

        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            const loc = window.location.search.substr(1);

            if (loc === "nord") {
                tailwind.config = {
                    theme: {
                        extend: {
                            colors: {
                                background1: '#2e3440',
                                background2: '#bf616a',
                                shadow1: '#3b4252',
                                foreground1: '#e5e9f0',
                                background3: '#3e4a5b',
                                base: '#2e3440',
                                mantle: '#3b4252',
                                crust: '#2e3440',
                                text: '#eceff4',
                                pink: '#b48ead',
                                lavender: '#81a1c1',
                                blue: '#88c0d0',
                                mauve: '#b48ead',
                            }
                        }
                    }
                };
            } else {
                tailwind.config = {
                    theme: {
                        extend: {
                            colors: {
                                rosewater: '#f5e0dc',
                                flamingo: '#f2cdcd',
                                pink: '#f5c2e7',
                                mauve: '#cba6f7',
                                red: '#f38ba8',
                                maroon: '#eba0ac',
                                peach: '#fab387',
                                yellow: '#f9e2af',
                                green: '#a6e3a1',
                                teal: '#94e2d5',
                                sky: '#89dceb',
                                sapphire: '#74c7ec',
                                blue: '#89b4fa',
                                lavender: '#b4befe',
                                text: '#cdd6f4',
                                subtext1: '#bac2de',
                                subtext0: '#a6adc8',
                                overlay2: '#9399b2',
                                overlay1: '#7f849c',
                                overlay0: '#6c7086',
                                surface2: '#585b70',
                                surface1: '#45475a',
                                surface0: '#313244',
                                base: '#1e1e2e',
                                mantle: '#181825',
                                crust: '#11111b'
                            }
                        }
                    }
                };
            }
        </script>

        <style>
            * {
                font-family: 'Fira Code', monospace;
            }
            
            .link-hover {
                transition: all 0.2s ease;
                position: relative;
            }
            
            .link-hover::after {
                content: '';
                position: absolute;
                width: 0;
                height: 2px;
                bottom: -2px;
                left: 0;
                background-color: currentColor;
                transition: width 0.2s ease;
            }
            
            .link-hover:hover::after {
                width: 100%;
            }
            
            .link-hover:hover {
                color: #f5c2e7;
                transform: translateX(4px);
            }
            
            .section-header {
                position: relative;
                padding-bottom: 4px;
            }

            .panel-top,
            .panel-main {
                position: relative;
            }

            .panel-main::before {
                content: '';
                position: absolute;
                pointer-events: none;
                top: calc(0.5rem - 1px);
                left: 0;
                right: 0;
                height: 2px;
                background: linear-gradient(to right, transparent, currentColor 20%, currentColor 80%, transparent);
                opacity: 0.55;
            }

            @media (min-width: 768px) {
                .panel-top::after,
                .panel-main::after {
                    content: '';
                    position: absolute;
                    pointer-events: none;
                    left: calc(100% / 3 + 0.5rem - 1px);
                    width: 2px;
                    opacity: 0.55;
                }

                .panel-top::after {
                    top: 0;
                    bottom: -0.5rem;
                    background: linear-gradient(to bottom, transparent, currentColor);
                }

                .panel-main::after {
                    top: 0.5rem;
                    bottom: 1rem;
                    background: linear-gradient(to bottom, currentColor, transparent);
                }
            }
            
            #searchfield {
                transition: all 0.3s ease;
            }
            
            #searchfield:focus {
                transform: scale(1.02);
            }
            
            .container-fade-in {
                animation: fadeIn 0.6s ease-in;
            }
            
            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(20px) skew(-6deg);
                }
                to {
                    opacity: 1;
                    transform: translateY(0) skew(-6deg);
                }
            }
            
            .time-pulse {
                animation: pulse 2s ease-in-out infinite;
            }
            
            @keyframes pulse {
                0%, 100% { opacity: 1; }
                50% { opacity: 0.8; }
            }
        </style>
    </head>
    <body class="bg-base flex items-center justify-center min-h-screen w-screen p-4">
        <!--Top Container-->
        <div class="flex w-full max-w-6xl flex-wrap skew-x-[-6deg] h-fit container-fade-in">

            <!--Top Bar-->
            <div class="panel-top text-pink flex w-full h-fit gap-4">
                <!--Time-->
                <div class="w-1/3 bg-blue h-full p-2 rounded-sm">
                    <p id="time" class="text-crust font-semibold time-pulse"></p>
                </div>
                <!--Date-->
                <div class="flex-1 bg-blue h-full p-2 rounded-sm">
                    <p id="date" class="text-crust font-semibold"></p>
                </div>
            </div>

            <!--Main Content-->
            <div class="panel-main text-pink flex w-full py-4 h-fit gap-4">

                <!--Image-->
                <div class="bg-mantle md:w-1/3 shrink-0 hidden md:block rounded-sm overflow-hidden">
                    <img src="lucy.png" alt="Lucy" class="w-full h-full object-cover" onerror="this.parentElement.style.display='none'"> 
                </div>

                <!--Links-->
                <div class="flex flex-wrap items-start content-start justify-evenly bg-mantle w-full md:flex-1 text-text text-base lg:text-lg p-6 md:p-8 lg:py-12 rounded-sm gap-8">

                    <!--Entertainment-->
                    <div class="flex items-center flex-col flex-none text-center">
                        <div class="section-header w-full mb-3 border-b-2 border-lavender pb-1">
                            <h2 class="text-pink font-semibold">/Entertainment/</h2>
                        </div>
                        <div class="space-y-2 w-full">
                            <div><a href="https://www.wcostream.net" target="_blank" class="link-hover inline-block">wco/</a></div>
                            <div><a href="https://www.youtube.com" target="_blank" class="link-hover inline-block">yt/</a></div>
                            <div><a href="https://steamdb.info/upcoming/free/" target="_blank" class="link-hover inline-block">sdb/</a></div>
                            <div><a href="http://127.0.0.1:8000/" target="_blank" class="link-hover inline-block">st/</a></div>
                        </div>
                    </div>

                    <!--Development-->
                    <div class="flex items-center flex-col flex-none text-center">
                        <div class="section-header w-full mb-3 border-b-2 border-lavender pb-1">
                            <h2 class="text-pink font-semibold">/Development/</h2>
                        </div>
                        <div class="grid grid-cols-2 gap-x-6 gap-y-2">
                            <div><a href="https://www.github.com/" target="_blank" class="link-hover inline-block">gh/</a></div>
                            <div><a href="https://chat.openai.com/chat" target="_blank" class="link-hover inline-block">cht/</a></div>
                            <div><a href="https://wolframalpha.com/" target="_blank" class="link-hover inline-block">wfa/</a></div>
                            <div><a href="https://www.leetcode.com/" target="_blank" class="link-hover inline-block">lc/</a></div>
                            <div><a href="http://127.0.0.1:3000/" target="_blank" class="link-hover inline-block">lh/</a></div>
                            <div><a href="http://127.0.0.1:7011/" target="_blank" class="link-hover inline-block">od/</a></div>
                        </div>
                    </div>

                    <!--Uni-->
                    <div class="flex items-center flex-col flex-none text-center">
                        <div class="section-header w-full mb-3 border-b-2 border-lavender pb-1">
                            <h2 class="text-pink font-semibold">/Uni/</h2>
                        </div>
                        <div class="grid grid-cols-2 gap-x-6 gap-y-2">
                            <div><a href="https://mail.uni-kl.de/" target="_blank" class="link-hover inline-block">mu/</a></div>
                            <div><a href="https://olat.vcrp.de/dmz/" target="_blank" class="link-hover inline-block">olt/</a></div>
                            <div><a href="https://qis.verw.uni-kl.de/qisserver/rds" target="_blank" class="link-hover inline-block">qis/</a></div>
                            <div><a href="https://office.kis.uni-kl.de/default.asp" target="_blank" class="link-hover inline-block">kis/</a></div>
                            <div><a href="https://exclaim.cs.uni-kl.de/login" target="_blank" class="link-hover inline-block">exc/</a></div>
                            <div><a href="https://gibtesheutepommes.de" target="_blank" class="link-hover inline-block">pom/</a></div>
                            <div><a href="https://sci-latex.informatik.uni-kl.de/project/" target="_blank" class="link-hover inline-block">latex/</a></div>
                        </div>
                    </div>
                </div>
            </div>

            <!--Bottom bar-->
            <div class="w-full flex h-fit gap-4">
                <!--Searchfield-->
                <div class="w-1/3 bg-mauve p-2 h-fit rounded-sm">
                    <input 
                     id="searchfield"
                     type="text" 
                     class="bg-mauve w-full h-full
                               placeholder:text-mantle focus:outline-none
                               focus:placeholder:text-transparent text-mantle font-medium" 
                     autofocus
                     placeholder="lurk..."
                     autocomplete="off"
                     spellcheck="false">
                </div>

                <!--Weather/Info bar-->
                <div class="bg-mauve flex-1 p-2 rounded-sm flex items-center justify-between">
                    <span class="text-mantle font-medium" id="greeting"></span>
                    <span class="text-mantle text-sm" id="weather"></span>
                </div>
            </div>

        </div>

        <!--Scripts-->
        <script>
            // Search functionality
            document.getElementById('searchfield').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    const query = this.value.trim();
                    if (query) {
                        window.location.href = "https://duckduckgo.com/?q=" + encodeURIComponent(query);
                    }
                }
            });

            // Clock display
            function displayClock() {
                const now = new Date();
                const timeString = now.toLocaleTimeString('en-US', { 
                    hour: '2-digit', 
                    minute: '2-digit',
                    second: '2-digit'
                });
                document.getElementById("time").textContent = timeString;
            }
            
            setInterval(displayClock, 1000);
            displayClock();

            // Date display
            function displayDate() {
                const now = new Date();
                const dateString = now.toLocaleDateString('en-US', { 
                    weekday: 'short', 
                    year: 'numeric', 
                    month: 'short', 
                    day: 'numeric' 
                });
                document.getElementById("date").textContent = dateString;
            }
            
            setInterval(displayDate, 60000);
            displayDate();

            // Greeting based on time
            function updateGreeting() {
                const hour = new Date().getHours();
                let greeting;
                
                if (hour < 12) greeting = "Good morning";
                else if (hour < 18) greeting = "Good afternoon";
                else greeting = "Good evening";
                
                document.getElementById("greeting").textContent = greeting;
            }
            
            updateGreeting();
            setInterval(updateGreeting, 60000);

            // Optional: Add keyboard shortcuts
            document.addEventListener('keydown', function(e) {
                // Focus search with '/' key
                if (e.key === '/' && document.activeElement !== document.getElementById('searchfield')) {
                    e.preventDefault();
                    document.getElementById('searchfield').focus();
                }
                
                // Clear search with Escape
                if (e.key === 'Escape' && document.activeElement === document.getElementById('searchfield')) {
                    document.getElementById('searchfield').value = '';
                    document.getElementById('searchfield').blur();
                }
            });
        </script>
    </body>
</html>
